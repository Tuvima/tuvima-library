name: Docs
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: read
concurrency:
  group: docs-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and validate docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Check and build
        shell: pwsh
        run: ./scripts/docs/build-docs.ps1 -InstallDependencies
      - name: Refresh Codex context
        shell: pwsh
        run: ./scripts/docs/refresh-codex-context.ps1
      - name: Upload checked site for link audit
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: website/dist
          retention-days: 7
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
  links:
    name: Audit external links
    needs: build
    runs-on: ubuntu-latest
    # Remote checks are advisory on PR/main/manual builds, blocking on the weekly audit.
    continue-on-error: ${{ github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: website
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: website/dist
      - name: Check remote links with bounded retries
        run: node scripts/check-external-links.mjs
        working-directory: website
      - name: Retain remote results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-external-links
          path: website/external-links-report.json
          retention-days: 7
  deploy:
    name: Deploy docs
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: docs-pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
