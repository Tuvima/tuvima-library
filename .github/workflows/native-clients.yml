name: Native clients

# Builds and checks the phone, TV and car apps. It has no triggers of its own for pushes and pull requests: the CI
# workflow calls it, and its result is part of the required "Build & Test" check, so a change that breaks an app
# cannot merge. It can also be started by hand (Actions, Native clients, Run workflow).
#
# The first job decides whether the change touches the apps or the Engine routes and wire types they use
# (.github/scripts/ci-scope.sh). When it does not, the other jobs are skipped and the check passes at once.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Decide whether the apps are affected
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the apps are affected
        id: scope
        run: bash .github/scripts/ci-scope.sh "${{ github.event_name }}" "${{ github.base_ref }}" "${{ github.event.before }}"

  contract:
    name: API v1 conformance
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.2xx"
      - run: dotnet restore tests/MediaEngine.Api.Tests/MediaEngine.Api.Tests.csproj
      - run: >-
          dotnet test tests/MediaEngine.Api.Tests/MediaEngine.Api.Tests.csproj --no-restore
          --filter "FullyQualifiedName~NativeClientContractFixtureTests|FullyQualifiedName~ClientApiV1GuardrailTests|FullyQualifiedName~ClientAuthorizationServiceFlowTests|FullyQualifiedName~PlaybackStateRepositoryTests"
      - name: Roku static contract gate
        shell: pwsh
        run: ./tests/native/Test-RokuClient.ps1
      - name: Native source boundary gate
        shell: pwsh
        run: ./tests/native/Test-NativeClientSources.ps1

  tv-web:
    name: TV web client (Tizen and webOS shell)
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: TV web static contract gate
        shell: pwsh
        run: ./tests/native/Test-TvWebClient.ps1

  android:
    name: Android TV, mobile, and Auto
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          # The action's default package list includes 'tools', which Google no longer
          # publishes; the next step installs the packages the build needs.
          packages: ""
      - name: Install Android SDK 37
        run: |
          # Android 37 packages use a minor-versioned name; list them so a rename is visible in the log.
          sdkmanager --list 2>/dev/null | grep -E "platforms;android-3[6-9]|build-tools;3[6-9]" || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"
      - name: Build Android applications
        working-directory: clients/android
        run: gradle :core:testDebugUnitTest :tv:assembleDebug :mobile:assembleDebug
      - name: Build unsigned release apps (no signing secrets here; android-release.yml signs them)
        working-directory: clients/android
        run: gradle :tv:assembleRelease :mobile:assembleRelease

  apple:
    name: iOS and CarPlay
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: clients/apple
        run: xcodegen generate
      - name: Build for iOS Simulator
        working-directory: clients/apple
        run: >-
          xcodebuild -project TuvimaApple.xcodeproj -scheme Tuvima
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
