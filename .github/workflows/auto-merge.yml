# Auto-merge enables GitHub's auto-merge on labelled claude/ pull requests.
#
# Why an App token: a merge done with the built-in GITHUB_TOKEN is attributed to github-actions[bot], and GitHub
# never starts new workflow runs for events caused by that token. Before this change every auto-merged pull request
# landed on main without CI, Docs or Docker publish ever running. The merge now happens as the "Tuvima Auto-merge"
# GitHub App, which GitHub treats like a normal contributor, so push-triggered workflows run again.
#
# One-time setup (organisation admin), before this workflow is merged:
#   1. Org settings -> Developer settings -> GitHub Apps -> New GitHub App, named "Tuvima Auto-merge".
#      Webhook: off. Repository permissions: Contents = Read and write, Pull requests = Read and write.
#      Install on: only Tuvima/tuvima-library.
#   2. Generate a private key on the App page (downloads a .pem).
#   3. Repository settings -> Secrets and variables -> Actions:
#        Variable  AUTO_MERGE_APP_ID           = the App ID
#        Secret    AUTO_MERGE_APP_PRIVATE_KEY  = the full contents of the .pem
#
# Without that setup the "Create App token" step fails and auto-merge does nothing (the pull request stays open for a
# manual merge).
#
# Branch protection on main requires the CI "Build & Test" check (from GitHub Actions), so auto-merge waits for it to
# pass. Without a required check, GitHub merges immediately and a red change lands on main.

name: Auto-merge

on:
  pull_request:
    types: [labeled, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.action != 'closed' &&
      contains(github.event.pull_request.labels.*.name, 'ready-to-merge') &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"

  # A merged claude/ branch of this repository is removed once its pull request is merged, unless another open pull
  # request still uses it as its head or its base. The nightly Branch cleanup workflow covers merges that do not raise
  # this event (a merge completed by auto-merge is not always delivered as a pull_request event).
  delete-merged-branch:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete the merged head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          open_head=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$BRANCH" --json number --jq 'length')
          open_base=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base "$BRANCH" --json number --jq 'length')
          if [ "$open_head" != "0" ] || [ "$open_base" != "0" ]; then
            echo "Keeping $BRANCH: another open pull request still uses it."
            exit 0
          fi
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null || true)
          if [ -n "$tip" ] && [ "$tip" != "$HEAD_SHA" ]; then
            echo "Keeping $BRANCH: it has commits newer than the merged pull request."
            exit 0
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" || echo "Branch $BRANCH was already gone."
          echo "Deleted $BRANCH (pull request #$PR_NUMBER)."
