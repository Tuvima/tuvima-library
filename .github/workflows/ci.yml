name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.2xx"

      - name: Restore dependencies
        run: dotnet restore MediaEngine.slnx

      - name: Build (warnings as errors)
        run: dotnet build MediaEngine.slnx --no-restore --warnaserror

      - name: Verify formatting
        run: dotnet format MediaEngine.slnx --verify-no-changes --no-restore

      - name: Run tests
        run: dotnet test MediaEngine.slnx --no-build --verbosity normal --filter "Category!=LiveProvider" --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Enforce coverage threshold
        shell: pwsh
        run: ./scripts/coverage/Enforce-Coverage.ps1 -ResultsDirectory ./TestResults

      - name: Setup Node for release asset verification
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Publish Dashboard (Release)
        run: dotnet publish src/MediaEngine.Web/MediaEngine.Web.csproj --configuration Release --output ./.tmp/ci/dashboard-publish

      - name: Verify Release CSS minification and compression
        run: node scripts/build/verify-dashboard-css.mjs ./.tmp/ci/dashboard-publish "" ./.tmp/ci/published-css.json

      - name: Check vulnerable packages
        run: dotnet list MediaEngine.slnx package --vulnerable --include-transitive

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          retention-days: 30
