name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual run on any branch behaves like a push to main: full format check, coverage collected and enforced.
  workflow_dispatch:
  # Nightly full run (everything, with coverage) so problems that a lighter pull-request check misses show up within a day.
  schedule:
    - cron: '0 6 * * *'

# Read-only: nothing here publishes anything, and pull requests from forks get the same read-only access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # How this workflow is paced.
  #
  # Fast check (every pull request): build with warnings as errors, format check of the changed C# files, the
  # Dashboard publish checks, the vulnerable-package check and every test, split over lanes that run side by side.
  # A change that touches the phone, TV and car apps, or the Engine routes they use, also builds the apps.
  # The slowest lane decides how long a pull request waits, so no lane does two slow things one after another.
  #
  # Deeper check (every merge to main, every night at 06:00 UTC, and on demand with "Run workflow" on any branch):
  # the same build and tests, plus a format check of the whole solution, code coverage and the coverage threshold.
  #
  # A change that only touches engineering/ (specs, handoffs, plans) has nothing to build or test, as a pull request
  # or as a push to main (.github/scripts/ci-scope.sh). The decision is a cheap step inside each job rather than a
  # separate job, because every extra job waits in the runner queue.
  build:
    name: Build and publish checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether code changed
        id: scope
        run: bash .github/scripts/ci-scope.sh "${{ github.event_name }}" "${{ github.base_ref }}" "${{ github.event.before }}"

      - name: Setup .NET
        if: steps.scope.outputs.code == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.2xx"

      - name: Cache NuGet packages
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        if: steps.scope.outputs.code == 'true'
        run: dotnet restore MediaEngine.slnx

      - name: Build (warnings as errors)
        if: steps.scope.outputs.code == 'true'
        run: dotnet build MediaEngine.slnx --no-restore --warnaserror

      # Developer tools outside the solution; building them here stops them silently breaking when product APIs change.
      - name: Build developer tools (warnings as errors)
        if: steps.scope.outputs.code == 'true'
        run: |
          dotnet build benchmarks/MediaEngine.Storage.Benchmarks/MediaEngine.Storage.Benchmarks.csproj --warnaserror
          dotnet build tools/MediaEngine.PerformanceProbe/MediaEngine.PerformanceProbe.csproj --warnaserror

      - name: Setup Node for release asset verification
        if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify native runtime output selection
        if: steps.scope.outputs.code == 'true'
        run: node --test tests/build/*.test.mjs

      - name: Run Dashboard script tests
        if: steps.scope.outputs.code == 'true'
        run: node --test tests/MediaEngine.Web.Tests/JavaScript/*.test.mjs

      - name: Publish Dashboard (Release)
        if: steps.scope.outputs.code == 'true'
        run: dotnet publish src/MediaEngine.Web/MediaEngine.Web.csproj --configuration Release --output ./.tmp/ci/dashboard-publish

      - name: Verify Release CSS minification and compression
        if: steps.scope.outputs.code == 'true'
        run: node scripts/build/verify-dashboard-css.mjs ./.tmp/ci/dashboard-publish "" ./.tmp/ci/published-css.json

      - name: Check vulnerable packages
        if: steps.scope.outputs.code == 'true'
        run: dotnet list MediaEngine.slnx package --vulnerable --include-transitive

  # The format check loads the whole solution and takes about four minutes, so it has a runner to itself instead of
  # making the build job wait. Pull requests check the C# files they changed; every other run checks the whole solution.
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether code changed
        id: scope
        run: bash .github/scripts/ci-scope.sh "${{ github.event_name }}" "${{ github.base_ref }}" "${{ github.event.before }}"

      - name: Setup .NET
        if: steps.scope.outputs.code == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.2xx"

      - name: Cache NuGet packages
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        if: steps.scope.outputs.code == 'true'
        run: dotnet restore MediaEngine.slnx

      - name: Verify formatting
        if: steps.scope.outputs.code == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mapfile -t files < <(git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}...HEAD" -- '*.cs')
            if [ "${#files[@]}" -eq 0 ]; then echo "No C# files changed."; exit 0; fi
            dotnet format MediaEngine.slnx --verify-no-changes --no-restore --include "${files[@]}"
          else
            dotnet format MediaEngine.slnx --verify-no-changes --no-restore
          fi

  # Six test lanes run side by side. The Api project is by far the slowest (about ten minutes on one runner), so it
  # is split over three runners by the first letter of the test class name. Lanes one and two each take the letters
  # listed in "only"; lane three takes every test the other two did not ("except" lists their letters), so a test
  # can never fall between lanes, whatever it is called. To rebalance, move letters between "only" lists and keep
  # "except" equal to both lists together. Two classes set the floor: AuthorizedDisplayProjectionReadServiceTests
  # (lane one) and UserPlaybackSettingsServiceTests (lane three) run their tests one after another for minutes
  # (measured 2026-11-24), so they sit in different lanes.
  # Code coverage is collected only outside pull requests: it slows the instrumented tests by roughly a fifth,
  # and the threshold is enforced where it is collected.
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Api 1 of 3
            projects: tests/MediaEngine.Api.Tests
            only: "A B V W Y"
          - name: Api 2 of 3
            projects: tests/MediaEngine.Api.Tests
            only: "C D E F G H I J K L M N O"
          - name: Api 3 of 3
            projects: tests/MediaEngine.Api.Tests
            except: "A B C D E F G H I J K L M N O V W Y"
          - name: Storage
            projects: tests/MediaEngine.Storage.Tests
          - name: Web
            projects: tests/MediaEngine.Web.Tests
          - name: Everything else
            projects: >-
              tests/MediaEngine.AI.Tests tests/MediaEngine.Admin.Tests tests/MediaEngine.Contracts.Tests
              tests/MediaEngine.Domain.Tests tests/MediaEngine.Identity.Tests tests/MediaEngine.Ingestion.Tests
              tests/MediaEngine.Intelligence.Tests tests/MediaEngine.Performance.Tests
              tests/MediaEngine.Processors.Tests tests/MediaEngine.Providers.Tests
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so origin/main exists for ReleasedStepsOnMain_AreUnchangedInThisChange.
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether code changed
        id: scope
        run: bash .github/scripts/ci-scope.sh "${{ github.event_name }}" "${{ github.base_ref }}" "${{ github.event.before }}"

      - name: Setup .NET
        if: steps.scope.outputs.code == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.2xx"

      - name: Cache NuGet packages
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The public docs live in their own repository. The Storage lane reads a few pages from it (PublicDocsDriftTests)
      # so they cannot quietly drift from the app; the nightly run catches pages edited there after this change merged.
      - name: Check out the public docs
        if: steps.scope.outputs.code == 'true' && matrix.name == 'Storage'
        uses: actions/checkout@v7
        with:
          repository: Tuvima/tuvima-docs
          path: .tmp/tuvima-docs
          fetch-depth: 1
          persist-credentials: false

      - name: Point the drift checks at the docs
        if: steps.scope.outputs.code == 'true' && matrix.name == 'Storage'
        run: echo "TUVIMA_DOCS_DIR=$GITHUB_WORKSPACE/.tmp/tuvima-docs" >> "$GITHUB_ENV"

      # Projects in one lane run at the same time; each prints its own result and any failure fails the lane.
      - name: Run tests
        if: steps.scope.outputs.code == 'true'
        shell: bash
        env:
          SHARD_ONLY: ${{ matrix.only }}
          SHARD_EXCEPT: ${{ matrix.except }}
        run: |
          coverage=()
          if [ "${{ github.event_name }}" != "pull_request" ]; then coverage=(--collect:"XPlat Code Coverage"); fi
          # Which tests this lane runs. Live provider tests never run here; a split lane also names its letters.
          filter="Category!=LiveProvider"
          prefix="FullyQualifiedName~MediaEngine.Api.Tests."
          if [ -n "$SHARD_ONLY" ]; then
            parts=""
            for letter in $SHARD_ONLY; do parts="${parts:+$parts|}${prefix}${letter}"; done
            filter="($parts)&$filter"
          elif [ -n "$SHARD_EXCEPT" ]; then
            for letter in $SHARD_EXCEPT; do filter="${prefix/\~/!~}${letter}&$filter"; done
          fi
          echo "Test filter: $filter"
          # Build first, one after another, so lanes never race on the shared project outputs.
          for project in ${{ matrix.projects }}; do dotnet build "$project" --verbosity quiet; done
          # At most three projects at once: timing-sensitive tests (file watchers, UI timers) misfire when
          # ten test hosts fight over four cores.
          pids=()
          for project in ${{ matrix.projects }}; do
            while [ "$(jobs -rp | wc -l)" -ge 3 ]; do sleep 1; done
            name=$(basename "$project")
            dotnet test "$project" --no-build --verbosity minimal --filter "$filter" "${coverage[@]}" \
              --results-directory "./TestResults/$name" > "test-$name.log" 2>&1 &
            pids+=("$!:$name")
          done
          failed=0
          for entry in "${pids[@]}"; do
            if ! wait "${entry%%:*}"; then failed=1; echo "::error::${entry##*:} failed"; fi
            echo "=== ${entry##*:} ==="; tail -n 60 "test-${entry##*:}.log"
          done
          exit $failed

      - name: Explain snapshot and native-library failures
        if: failure()
        run: |
          # Short diagnostics so a red run shows what differs without downloading artifacts.
          for received in tests/MediaEngine.Contracts.Tests/Fixtures/*.received.txt; do
            [ -e "$received" ] || continue
            echo "=== ${received##*/} differs from approved (first 120 diff lines) ==="
            diff -u "${received/.received./.approved.}" "$received" | head -120 || true
          done

      - name: Upload test results
        if: github.event_name != 'pull_request' && steps.scope.outputs.code == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ strategy.job-index }}
          path: ./TestResults
          retention-days: 30

  # The phone, TV and car apps. The called workflow decides by itself whether this change touches them; when it
  # does not, its jobs are skipped and it passes at once. Its result is part of the required check below.
  native:
    name: Native clients
    uses: ./.github/workflows/native-clients.yml

  # The single required check on main. It always runs and reports, whether the heavy jobs ran, were skipped
  # (engineering-only change) or failed, so the ready-to-merge auto-merge keeps working. Outside pull requests it
  # also enforces the coverage threshold from the merged lane results.
  gate:
    name: Build & Test
    needs: [build, format, test, native]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every job to pass
        run: |
          echo "build=${{ needs.build.result }} format=${{ needs.format.result }} test=${{ needs.test.result }} native=${{ needs.native.result }}"
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.format.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then exit 1; fi
          # The app jobs are skipped when the change does not touch the apps; anything else must be a pass.
          if [ "${{ needs.native.result }}" != "success" ] && [ "${{ needs.native.result }}" != "skipped" ]; then exit 1; fi

      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request' && needs.build.outputs.code == 'true'
        with:
          persist-credentials: false

      - name: Download test results
        if: github.event_name != 'pull_request' && needs.build.outputs.code == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: ./TestResults
          merge-multiple: true

      - name: Enforce coverage threshold
        if: github.event_name != 'pull_request' && needs.build.outputs.code == 'true'
        shell: pwsh
        run: ./scripts/coverage/Enforce-Coverage.ps1 -ResultsDirectory ./TestResults
