name: Windows tests (temporary)

on:
  push:
    branches: [claude/project-thread-rksklj]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.2xx"
      - run: dotnet build MediaEngine.slnx -c Debug
      - name: Failing tests
        continue-on-error: true
        run: >
          dotnet test MediaEngine.slnx --no-build --logger "console;verbosity=normal" --filter
          "FullyQualifiedName~FileWriteSchedulerTests|FullyQualifiedName~ViewItemFileWriterTests|FullyQualifiedName~VaultMoveTests|FullyQualifiedName~LibraryItemDeletionTests|FullyQualifiedName~UserDeletionTests|FullyQualifiedName~ServicePluginTests|FullyQualifiedName~AuthorizedDisplayProjectionReadServiceTests|FullyQualifiedName~VideoOrderRenamerTests|FullyQualifiedName~FolderFirstCheckRepositoryTests|FullyQualifiedName~ImportUploadRelayTests"
