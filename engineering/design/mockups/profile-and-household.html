:root{--root:#101115;--shell:#14151A;--surface:#1A1B21;--raised:#1F2027;--hover:#272830;--menu:#2F3039;--tx:#F5F7FB;--tx2:#B6C2D6;--mu:#94A3B8;--ac:#8852FC;--ac-h:#A46FFF;--ac-soft:rgba(136,82,252,.16);--ac-b:rgba(136,82,252,.42);--b0:rgba(148,163,184,.10);--b1:rgba(148,163,184,.16);--b2:rgba(182,194,214,.46);--warn:#F59E0B;--warn-soft:rgba(245,158,11,.14);--danger:#FF6A5F;--ok:#22C55E}
*{box-sizing:border-box}html{font-size:14px}body{margin:0;background:#08090B;color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,sans-serif}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}svg.i.s{width:20px;height:20px}svg.i.xs{width:16px;height:16px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}a{color:inherit;text-decoration:none}
/* ---- review frame (outside the product) ---- */
.rv-bar{position:sticky;top:0;z-index:50;background:#08090B;border-bottom:1px solid #23252d;padding:10px 16px;display:flex;gap:8px;align-items:center;overflow-x:auto}
.rv-bar b{white-space:nowrap;margin-right:8px;color:var(--mu);font-weight:600}
.rv-bar button{white-space:nowrap;padding:8px 12px;border-radius:8px;color:var(--tx2);border:1px solid #23252d}
.rv-bar button[aria-pressed=true]{background:#fff;color:#000;border-color:#fff}
.rv-wrap{max-width:1500px;margin:0 auto;padding:16px}
.rv-title{font-size:18px;font-weight:700;margin:6px 0 2px}.rv-sub{color:var(--mu);margin:0 0 12px;max-width:900px}
.rv-scroll{overflow-x:auto;border:1px solid #23252d;border-radius:10px}
.rv-notes{max-width:900px;margin:16px 0 60px;padding:0;list-style:none;counter-reset:n}
.rv-notes li{position:relative;padding:8px 0 8px 40px;border-bottom:1px solid #1b1d24;color:var(--tx2)}
.rv-notes li b{color:var(--tx)}
.rv-notes li::before{counter-increment:n;content:counter(n);position:absolute;left:0;top:8px}
.mk,.rv-notes li::before{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#FFE14D;color:#000;font:700 12px/1 Inter,system-ui,sans-serif}
.mk{position:absolute;z-index:20;box-shadow:0 0 0 2px #000}
.screen{display:none}.screen.on{display:block}
.phones{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.phone{width:390px;max-width:100%;height:844px;position:relative;overflow:hidden;background:var(--root);border:1px solid #23252d;border-radius:10px;display:flex;flex-direction:column}
.cap{color:var(--mu);font-size:12px;margin:0 0 6px}
/* ---- product: shell ---- */
.app{position:relative;min-width:1024px;background:var(--root);min-height:860px}
.top{height:65px;background:var(--shell);display:flex;align-items:center;padding:0 18px;position:relative}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:28px;height:28px}.brand span{font:500 21px/1 'Tuvima Sans',Inter,sans-serif;letter-spacing:.14em}
.top nav{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:24px;font:500 15px/1 'Tuvima Sans',Inter,sans-serif;letter-spacing:.08em;color:var(--tx2)}
.top .r{margin-left:auto;display:flex;align-items:center;gap:22px}.top .r>svg{color:var(--tx)}
.acct{display:flex;align-items:center;gap:6px;height:42px;padding:0 8px 0 6px;border-radius:999px;font-weight:500}.acct.open{background:var(--hover)}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;flex:none;width:30px;height:30px;font-size:13px}
.av.m{width:40px;height:40px;font-size:16px}.av.l{width:72px;height:72px;font-size:28px}.av.xl{width:96px;height:96px;font-size:38px}
.c1{background:#8852FC}.c2{background:#14B8A6}.c3{background:#EC4899}.c4{background:#FF9F43}
.body{display:flex}
.side{position:relative;width:296px;flex:none;border-right:1px solid var(--b0);padding:12px 16px 24px;min-height:795px}
.side h6{margin:22px 0 8px 11px;font:500 14px/1 Inter;color:var(--tx2)}.side h6:first-child{margin-top:10px}
.side a{display:flex;align-items:center;gap:14px;height:44px;padding:0 14px;border-radius:8px;color:var(--mu);margin-bottom:4px;border-left:3px solid transparent}
.side a.on{background:var(--ac-soft);color:var(--tx);border-left-color:var(--ac);font-weight:500}
.side a .pill{margin-left:auto;background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:1px 8px;font-size:12px;font-weight:600}
.main{flex:1;min-width:0;padding:24px 42px 60px 32px;position:relative}
h1{font:700 28px/1.15 Inter;letter-spacing:-.42px;margin:6px 0 6px}.lead{color:var(--mu);margin:0 0 18px}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--b0);margin-bottom:22px}
.tabs button{display:flex;align-items:center;gap:8px;height:48px;color:var(--tx2);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac)}.tabs button.on svg{color:var(--ac-h)}
.card{background:var(--surface);border:1px solid var(--b0);border-radius:8px}
h2{font:600 16px/1.3 Inter;margin:26px 0 4px}.h2s{color:var(--mu);font-size:13px;margin:0 0 10px}
.rows{border-radius:8px;background:var(--surface);border:1px solid var(--b0)}
.row{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 16px;border-bottom:1px solid var(--b0);position:relative}
.row:last-child{border-bottom:0}.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:500}.row .t small{color:var(--mu);font-size:13px}
.row>svg.lead-i{color:var(--tx2)}.row .v{color:var(--tx2)}.row .go{color:var(--mu)}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--b2);font-weight:500;white-space:nowrap}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.sm{height:36px}
.ib{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:10px;color:var(--tx2)} /* bare icon button: no border */
.chip{display:inline-block;padding:2px 8px;border-radius:3px;border:1px solid var(--b1);background:var(--raised);font-size:12px;font-weight:500;color:var(--tx2);white-space:nowrap}
.chip.you{border-color:var(--ac-b);background:var(--ac-soft);color:#C9B2FF}.chip.kid{background:rgba(136,82,252,.5);border-color:transparent;color:#fff}
.sw{width:40px;height:22px;border-radius:999px;background:#3a3c47;position:relative;flex:none}.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#aab2c0}
.sw.on{background:var(--ac)}.sw.on::after{left:20px;background:#fff}
.seg{display:inline-flex;padding:4px;border-radius:10px;background:var(--surface);border:1px solid var(--b0)}.seg span{padding:9px 14px;border-radius:8px;color:var(--tx2);font-weight:500;white-space:nowrap}.seg span.on{background:var(--ac);color:#fff}
.sel{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;height:44px;min-width:180px;padding:0 10px 0 14px;border-radius:10px;background:var(--surface);border:1px solid var(--b1)}
.idcard{display:flex;align-items:center;gap:20px;padding:20px;background:linear-gradient(120deg,#231d38,#1A1B21 60%);position:relative}
.idcard h3{font:700 26px/1.1 Inter;margin:0 0 6px}.idcard p{margin:0;color:var(--tx2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.stat{padding:14px 16px}.stat b{font-size:24px;display:block;line-height:1.1}.stat small{color:var(--mu)}
/* ---- product: account menu ---- */
.menu{position:absolute;right:27px;top:55px;width:288px;background:var(--menu);border:1px solid var(--b1);border-radius:8px;box-shadow:0 18px 40px rgba(0,0,0,.5);padding:6px;z-index:10;font-size:16px}
.menu .me{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;background:rgba(255,255,255,.05);position:relative}
.menu .me b{display:block;font-weight:600}.menu .me small{color:var(--tx2);font-size:13px}.menu .me>svg{margin-left:auto;color:var(--tx2)}
.menu .lbl{font-size:13px;color:var(--mu);padding:12px 10px 4px}
.menu a{display:flex;align-items:center;gap:12px;height:48px;padding:0 10px;border-radius:8px;font-weight:500;position:relative}
.menu a>svg:first-child{width:30px;color:var(--tx2)}.menu a .end{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--mu)}
.menu hr{border:0;border-top:1px solid var(--b1);margin:6px -6px}
.cnt{background:var(--warn);color:#1F1303;border-radius:3px;padding:0 7px;font-size:12px;font-weight:700}
/* ---- product: phone ---- */
.ptop{height:48px;display:flex;align-items:center;gap:8px;padding:0 6px 0 2px;background:var(--shell);flex:none}.ptop b{font-size:16px;font-weight:600;flex:1}.ptop .av{margin-right:8px}
.pbody{flex:1;overflow:hidden;padding:14px 16px;position:relative}
.dock{height:64px;margin:0 36px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--b0);display:flex;justify-content:space-around;align-items:center;flex:none;font-size:12px;color:var(--tx2)}
.dock span{display:grid;justify-items:center;gap:2px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--menu);border-radius:16px 16px 0 0;padding:8px 10px 18px;font-size:16px;z-index:10}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:#5a5d6b;margin:2px auto 10px}
.sheet .menu{position:static;width:auto;border:0;box-shadow:none;padding:0;background:none}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:5}
.phone h1{font-size:24px}.phone .tabs{gap:20px;overflow:hidden}.phone .seg{display:flex}.phone .seg span{flex:1;text-align:center;padding:9px 4px}
.prow{display:block}.prow .ctl{margin-top:8px}
.empty{max-width:560px;margin:90px auto;text-align:center}.empty h3{font:600 20px/1.2 Inter;margin:14px 0 8px}.empty p{color:var(--tx2);margin:0 0 18px}
.subnav{width:232px;flex:none;border-right:1px solid var(--b0);padding:18px 14px;min-height:795px}.subnav h6{margin:16px 0 8px 10px;font:400 12px/1 Inter;color:var(--mu)}.subnav a{display:flex;gap:12px;align-items:center;height:40px;padding:0 12px;border-radius:8px;color:var(--tx2)}.subnav a.on{background:var(--ac-soft);color:var(--tx)}
.prog{height:4px;border-radius:2px;background:#2a2c36;margin-top:14px;position:relative}.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--ac)}
.phones>div{max-width:100%}
.rv-hint{display:none;color:var(--warn);font-size:12px;margin:0 0 8px}
@media(max-width:1100px){.rv-wrap{padding:16px 0}.rv-title,.rv-sub,.rv-notes,.cap{margin-left:12px;margin-right:12px}.rv-scroll{border-radius:0;border-left:0;border-right:0}}
@media(max-width:1000px){.rv-hint{display:block;margin-left:12px}}
@media(max-width:420px){.phone{border-radius:0;border-left:0;border-right:0}.phones{gap:28px}}

.tabs button{white-space:nowrap;flex:none}.phone .tabs .xt{display:none}
@media(max-width:1100px){.tabs{gap:18px}}
@media(max-width:1100px){.tabs{gap:14px;overflow-x:auto;scrollbar-width:none}.tabs button{gap:6px;font-size:13px}}
@media(max-width:1100px){.app .tabs button svg{display:none}}

const I=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const mk=(n,st)=>`<span class="mk" style="${st}">${n}</span>`;
const topBar=(open)=>`<div class="top"><div class="brand"><img src="${LOGO}" alt=""><span>LIBRARY</span></div><nav><span>READ</span><span>WATCH</span><span>LISTEN</span><span>VIEW</span><span>COLLECTIONS</span></nav><div class="r">${I('search')}${I('mark')}${I('sync')}<span class="acct ${open?'open':''}"><span class="av c1">S</span>Shy ${I('down','xs')}</span></div></div>`;
const side=(on,m='')=>{const r=(k,ic,t,x='')=>`<a class="${on===k?'on':''}">${I(ic,'s')}${t}${x}</a>`;return `<div class="side"><h6>Personal</h6>${r('me','acct','My profile')}${r('sec','lock','Security &amp; Devices')}${r('house','group','Household')}${m}<h6>Library</h6>${r('lib','folder','Libraries','<span class="pill">34</span>')}${r('pb','play','Playback')}<h6>Server</h6>${r('gen','gear','General')}${r('ua','key','Users &amp; Households')}${r('net','wifi','Network &amp; Remote Access')}${r('tools','build','Tools')}${r('ai','chip','Local AI')}${r('pl','ext2','Plugins')}${r('int','link','Integrations')}${r('bk','cloud','Backups')}${r('sys','desk','System')}</div>`};
const menuBody=(ph)=>`<a class="me">${ph?'':mk(1,'left:-18px;top:14px')}<span class="av m c1">S</span><span><b>Shy</b><small>Profile and preferences</small></span>${I('right')}</a>
<div class="lbl">Switch to</div>
<a>${ph?'':mk(2,'left:-18px;top:13px')}<span class="av c2">S</span>Sam</a><a><span class="av c3">M</span>Mia<span class="end"><span class="chip kid">Kids</span></span></a><a><span class="av c4">G</span>Grandpa Joe<span class="end">${I('lock','xs')}</span></a>
<hr><a>${ph?'':mk(3,'left:-18px;top:13px')}${I('group')}Household</a><a>${I('gear')}Settings<span class="end"><span class="cnt">34</span></span></a><a>${I('bin')}Recycle bin</a><a>${I('help')}Help<span class="end">${I('ext','xs')}</span></a>
<hr><a>${ph?'':mk(4,'left:-18px;top:13px')}${I('out')}Sign out</a>`;
const meTabs=(on)=>`<div class="tabs"><button class="${on==0?'on':''}">${I('acct','s')}Profile</button><button class="${on==1?'on':''}">${I('tune','s')}Preferences</button><button>${I('hist','s')}Activity</button><button>${I('star','s')}Taste</button><button class="xt">${I('link','s')}Linked accounts</button><button class="xt">${I('shield','s')}Access &amp; safety</button></div>`;
const prefRows=(ph)=>{const c=ph?'row prow':'row';return `
<div style="position:relative;display:inline-block">${mk(ph?2:3,'left:-10px;top:-10px')}<div class="seg"><span class="on">Watching</span><span>Listening</span><span>Reading</span><span>Home</span></div></div>
<h2>Resume and progress</h2><div class="rows"><div class="row"><div class="t"><b>Resume where you left off</b><small>Continue from your last saved position.</small></div><span class="sw on"></span></div><div class="row"><div class="t"><b>Show chapter marks on the progress bar</b><small>Off for video and on for audiobooks until you choose.</small></div><span class="sw"></span></div></div>
<h2>Subtitles and audio</h2><div class="rows"><div class="${c}"><div class="t"><b>Audio language</b><small>The track the player starts with.</small></div><div class="ctl"><span class="sel">English ${I('down','s')}</span></div></div><div class="${c}"><div class="t"><b>Subtitle language</b><small>The subtitles the player picks when it shows them.</small></div><div class="ctl"><span class="sel">English ${I('down','s')}</span></div></div><div class="${c}"><div class="t"><b>Show subtitles</b><small>Auto shows them only when the audio is not in your subtitle language.</small></div><div class="ctl"><span class="seg"><span class="on">Off</span><span>Auto</span><span>Always</span></span></div></div></div>
${ph?'':`<h2>Spoilers</h2><div class="rows"><div class="row"><div class="t"><b>Characters on Universe pages</b><small>Up to where I am keeps characters you haven't met yet out of Universe pages.</small></div><span class="seg"><span class="on">Up to where I am</span><span>Everything</span></span></div></div>`}`};
const people=(ph)=>{const p=(c,l,n,s,ch,m='')=>`<div class="row">${m}${ph?'':`<span class="ib" style="width:24px;color:var(--mu)">${I('drag','s')}</span>`}<span class="av m ${c}">${l}</span><div class="t"><b>${n} ${ch}</b><small>${s}</small></div><span class="go">${I('right')}</span></div>`;
return `<div class="rows">${p('c1','S','Shy','Administrator · no PIN','<span class="chip you">You</span>',mk(ph?1:2,'left:-10px;top:18px'))}${p('c2','S','Sam','Member · no PIN','')}${p('c3','M','Mia','Kid','<span class="chip kid">Kids</span>')}${p('c4','G','Grandpa Joe','Member · PIN set','')}<div class="row" style="color:var(--tx2)">${ph?'':'<span style="width:24px"></span>'}<span class="av m" style="border:1px dashed var(--b2);color:var(--tx2)">${I('add','s')}</span><div class="t"><b>Add profile</b></div></div></div>
<h2 style="position:relative">${mk(ph?2:3,ph?'right:0;top:-1px':'left:-28px;top:-1px')}For everyone in this household</h2><div class="rows"><div class="row">${I('shield','lead-i')}<div class="t"><b>What Kids can see</b><small>Up to PG and TV-PG · no Vault</small></div><span class="go">${I('right')}</span></div><div class="row">${I('folder','lead-i')}<div class="t"><b>Libraries this household can use</b><small>All 8 libraries</small></div><span class="go">${I('right')}</span></div></div>`};

{id:'menu',name:'1 Profile menu',kind:'d',title:'Profile menu in the top bar',sub:'Opened from your picture at the top right. Today the top row is a label you cannot press, and "Manage profiles", "Profile" and "Settings" sit side by side with no hint about which one changes your own options.',
html:()=>`<div class="app">${topBar(true)}<div class="menu">${menuBody()}</div><div style="padding:120px 0;text-align:center;color:#3b3e49">Home</div></div>`,
notes:['<b>Your own row is a button.</b> Pressing your name opens My profile (screen 2). The second line says what is behind it. Today this row does nothing.','<b>Switch to.</b> The other people in the household, each with their own color so two people with the same initial are not identical circles. A small lock shows who has a PIN. "Who\'s watching?" is dropped from the menu because this list is the same thing; the full-screen picker still appears when Library opens.','<b>Household replaces "Manage profiles".</b> One clear name for the page about the people you live with (screen 4). Only household administrators see it. "Profile" is gone as a separate row because the top row now does that job.','<b>Sign out lines up with the other rows</b> and is shown only when this browser is signed in with a password. On a home network with no password there is nothing to sign out of.']},
{id:'me',name:'2 My profile',kind:'d',title:'My profile: you, in one place',sub:'Settings > Personal > My profile. Replaces today\'s "Profile" page (statistics only) and the trip through Manage Profiles to reach your own options.',
html:()=>`<div class="app">${topBar()}<div class="body">${side('me',mk(1,'right:26px;top:53px'))}<div class="main"><h1>My profile</h1><p class="lead">Your name and picture, how Library plays and reads for you, and what you have been enjoying.</p>${meTabs(0)}
<div class="card idcard">${mk(2,'left:-10px;top:-10px')}<span class="av xl c1">S</span><div style="flex:1"><h3>Shy</h3><p>Administrator · joined November 2026</p></div><span class="btn">${I('edit','s')}Edit name and picture</span></div>
<h2 style="position:relative">${mk(3,'left:-28px;top:-1px')}Sign-in and safety</h2><div class="rows"><div class="row">${I('lock','lead-i')}<div class="t"><b>Profile PIN</b><small>Not set. Anyone at home can open this profile.</small></div><span class="btn sm">Set a PIN</span></div><div class="row">${I('key','lead-i')}<div class="t"><b>Password and email</b><small>Not set · works on your home network only</small></div><span class="go">${I('right')}</span></div><div class="row">${I('desk','lead-i')}<div class="t"><b>Devices</b><small>2 browsers signed in</small></div><span class="go">${I('right')}</span></div></div>

notes:['<b>"My profile" and "Household" are separate rows.</b> My profile is about you. Household (screen 4) is about everyone. Today your own options are reached through "Manage Profiles", which reads as an administrator page.','<b>One Edit button.</b> Name and picture in one small window. Today there are two different Edit windows (one on Profile, one in Manage Profiles) and only one of them shows the PIN.','<b>Sign-in and safety rows.</b> The PIN is set right here. Password, email and devices link to Security &amp; Devices, which stays as it is.','<b>The statistics stay.</b> Nothing from today\'s Profile page is removed. Activity, Taste and Linked accounts keep their tabs; Preferences (screen 3) is the new tab. Access &amp; safety appears only for administrators, as today. On a phone the tab row scrolls sideways.']},
{id:'prefs',name:'3 My preferences',kind:'d',title:'My profile > Preferences',sub:'The options people change most: subtitles, languages, resume, reading. Same options and wording as today; only the place changes.',
html:()=>`<div class="app">${topBar()}<div class="body">${side('me')}<div class="main"><h1>My profile</h1><p class="lead">Your name and picture, how Library plays and reads for you, and what you have been enjoying.</p><div style="position:relative">${mk(1,'left:112px;top:-8px')}${meTabs(1)}</div><div style="position:relative">${mk(2,'left:-28px;top:-8px')}<p class="lead" style="margin-top:-6px">These follow you to every phone, TV and browser.</p></div>${prefRows()}</div></div></div>`,
notes:['<b>Two presses from anywhere:</b> your picture, your name, then the Preferences tab. Today it is five: picture, Manage profiles, Edit beside your name, Preferences, then the section.','<b>One line says these are yours and follow you.</b> Options that belong to one device ("On this device": maximum resolution, hardware decoding, surround) move to the bottom of Watching under their own heading, so the two kinds are not mixed.','<b>Watching, Listening, Reading, Home</b> stay as the four sections, with the shared segmented control. All existing options are kept.']},
{id:'house',name:'4 Household',kind:'d',title:'Household: the people you live with',sub:'Settings > Personal > Household. Replaces "Manage Profiles". Brings together what is split today between Manage Profiles and Server > Users & Households > Households.',
html:()=>`<div class="app">${topBar()}<div class="body">${side('house')}<div class="main"><div style="display:flex;align-items:center;gap:6px;position:relative">${mk(1,'left:-28px;top:10px')}<h1 style="margin:6px 0">Shy's household</h1><span class="ib">${I('edit','s')}</span></div><p class="lead">4 people. Everyone here shares the same libraries and Kids settings.</p>${people()}

notes:['<b>The page is named after the household</b>, and the pencil renames it. Today the name is changed on a different page under Server.','<b>One row per person, one line of plain words.</b> The whole row opens that person\'s page (screen 5). Today each row carries up to three badges and a bordered Edit button; "Household administrator" and "Server administrator" become the single word Administrator here, with the detail on the person\'s page. The handle on the left sets the order on the Who\'s watching screen, as today.','<b>Household-wide choices sit together.</b> "What Kids can see" is here today as a drop-down; "Libraries this household can use" moves here from Server > Users &amp; Households, because it is about this household. Nothing new is added here: the Who\'s watching screen keeps working as it does today.','<b>Creating and removing whole households stays under Server</b>, as you decided on 30 October. The right-aligned sentence at the top of today\'s page becomes this one quiet line, shown only to server administrators.']},
{id:'person',name:'5 A person',kind:'d',title:'A person in the household',sub:'Opened from a row on Household. Today this page is titled "Manage Profiles" twice and shows the same back link twice.',
html:()=>`<div class="app">${topBar()}<div class="body">${side('house')}<div class="main"><a style="color:var(--tx2);display:inline-flex;align-items:center;gap:6px;position:relative">${mk(1,'left:-28px;top:0')}${I('back','s')}Shy's household</a>
<div style="display:flex;align-items:center;gap:18px;margin:16px 0 18px"><span class="av l c3">M</span><div><h1 style="margin:0 0 6px">Mia</h1><span class="chip kid">Kids</span></div></div>
<div class="tabs" style="position:relative">${mk(2,'left:-28px;top:12px')}<button class="on">${I('acct','s')}Profile</button><button>${I('tune','s')}Preferences</button><button>${I('shield','s')}Access &amp; safety</button><button>${I('hist','s')}Activity</button></div>
<div class="rows"><div class="row">${I('edit','lead-i')}<div class="t"><b>Name and picture</b><small>Mia</small></div><span class="btn sm">Edit</span></div><div class="row">${I('lock','lead-i')}<div class="t"><b>Profile PIN</b><small>Not set</small></div><span class="btn sm">Set a PIN</span></div><div class="row">${I('shield','lead-i')}<div class="t"><b>Kid's profile</b><small>A calmer, simpler Library that follows the household's Kids settings.</small></div><span class="sw on"></span></div></div>

notes:['<b>One back link, and the page is titled with the person\'s name.</b>','<b>Same tabs as today</b> (Profile, Preferences, Access &amp; safety), plus Activity as a tab instead of a row. For your own row this page is My profile, so there is one version of "your" page, not two.','<b>Delete stays at the bottom</b>, asks once, then happens (your existing rule). The sentence under it says what is lost.']},
{id:'phone',name:'6 Phone',kind:'p',title:'The same on a phone',sub:'Phone equals desktop: the same rows and options, in sheets and single columns.',
html:()=>`<div class="phones">
<div><p class="cap">Profile sheet</p><div class="phone"><div class="ptop"><span class="ib">${I('menu')}</span><b></b><span class="av c1">S</span></div><div class="pbody"><div class="dim"></div></div><div class="sheet">${mk(1,'left:8px;top:10px')}<div class="grab"></div><div class="menu">${menuBody(true)}</div></div></div></div>

<div><p class="cap">Household</p><div class="phone"><div class="ptop"><span class="ib">${I('back')}</span><b>Household</b><span class="av c1">S</span></div><div class="pbody"><div style="display:flex;align-items:center;gap:4px"><h1 style="margin:0">Shy's household</h1><span class="ib">${I('edit','s')}</span></div><p class="lead">4 people.</p>${people(true)}</div><div class="dock"><span>${I('home')}Home</span><span>${I('search')}Search</span><span>${I('mark')}My List</span></div></div></div></div>`,
notes:['<b>The profile sheet uses the full width.</b> Today the sheet\'s rows stop at about half the screen, with the Kids badge and the Settings count stranded in the middle. Same rows as the desktop menu.','<b>Preferences on a phone:</b> the page title bar says where you are and the back arrow returns to Settings; today the phone shows a page selector, a back link, a title and a second back link before the first option. Each option stacks its control under its label so nothing is squeezed.','<b>Household on a phone:</b> the same list, one press to a person. The order handle is replaced by "Reorder" inside the page\'s "..." menu on touch screens (not drawn).']},
{id:'waiting',name:'7 Honest waiting',kind:'d',title:'Watch, when files are waiting on a metadata source',sub:'Not about profiles: an area the walk-through showed needs attention. Today this page says "Watch is waiting for media. Add items to your library" with an "Add a library" button, although 19 video files were found and are waiting.',
html:()=>`<div class="app">${topBar()}<div class="body"><div class="subnav"><h6>Library</h6><a class="on">${I('play','s')}Discover</a><a>${I('tv','s')}Movies</a><a>${I('tv','s')}TV Shows</a><a>${I('tv','s')}Videos</a><h6>Watch next</h6><a>${I('play','s')}Continue Watching</a><a>${I('hist','s')}Recently Added</a></div><div class="main"><div class="empty"><div style="position:relative;display:inline-block;color:var(--warn)">${mk(1,'left:-34px;top:8px')}<svg class="i" style="width:44px;height:44px" viewBox="0 0 24 24"><path d="${P.tv}"/></svg></div><h3>19 videos found, none identified yet</h3><p>Films and TV shows need a metadata source before Library can name them and fetch posters. Connect one and they appear here by themselves.</p><div style="display:flex;gap:12px;justify-content:center;position:relative">${mk(2,'left:60px;top:-12px')}<span class="btn p">Connect a metadata source</span><span class="btn">See the 19 files</span></div><p style="margin-top:22px;color:var(--mu);position:relative">${mk(3,'left:40px;top:-2px')}Your 4 personal videos need no source and are in <a style="color:var(--ac-h)">Videos</a>.</p></div></div></div></div>`,
notes:['<b>Say what is true.</b> The page counts what was found and names the one thing that is missing, instead of suggesting you add a library you already added.','<b>Two actions that match the two things a person can do:</b> connect a source (Settings > Plugins) or look at the files (Needs Review). The same pattern applies to Read (comics need a source) and Listen.','<b>Point at what does work.</b> If part of the area is ready, say where it is.']}
];
const bar=document.getElementById('bar'),wrap=document.getElementById('wrap');
S.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.name;b.onclick=()=>show(i);bar.appendChild(b);
const d=document.createElement('section');d.className='screen';d.id=s.id;d.innerHTML=`<p class="rv-title">${s.title}</p><p class="rv-sub">${s.sub}</p>${s.kind=='d'?`<p class="rv-hint">Desktop screen: scroll sideways, or open screen 6 for the phone version.</p><div class="rv-scroll">${s.html()}</div>`:s.html()}<ol class="rv-notes">${s.notes.map(n=>`<li>${n}</li>`).join('')}</ol>`;wrap.appendChild(d)});
function show(i){document.querySelectorAll('.screen').forEach((e,k)=>e.classList.toggle('on',k==i));bar.querySelectorAll('button').forEach((e,k)=>e.setAttribute('aria-pressed',k==i));try{history.replaceState(null,'','#'+S[i].id)}catch(e){}}
const h=S.findIndex(s=>"#"+s.id==location.hash);show(h>=0?h:(innerWidth<700?5:0));
</script></body></html>
