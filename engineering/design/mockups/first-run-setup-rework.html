<title>Setup Rework Mockups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: screen picker on top, one setup window at a time (sidebar of steps + stage). Dark-first, Tuvima tokens. */
:root{--bg:#070A12;--shell:#0B1020;--surf:#111827;--raise:#151E2F;--hover:#1A2438;--line:rgba(148,163,184,.16);--strong:rgba(182,194,214,.46);--tx:#F5F7FB;--tx2:#B6C2D6;--mut:#94A3B8;--acc:#8852FC;--accsoft:rgba(136,82,252,.16);--ok:#4ADE80;--oksoft:rgba(74,222,128,.13);--warn:#E6B450;--warnsoft:rgba(230,180,80,.14);--err:#F87171;--errsoft:rgba(248,113,113,.13);--info:#38BDF8;--infosoft:rgba(56,189,248,.13);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F3F5F9;--shell:#E9EDF4;--surf:#FFFFFF;--raise:#F6F8FB;--hover:#EDF1F7;--line:rgba(30,41,59,.16);--strong:rgba(30,41,59,.5);--tx:#0F172A;--tx2:#334155;--mut:#64748B;--accsoft:rgba(136,82,252,.12);--ok:#15803D;--oksoft:rgba(21,128,61,.1);--warn:#A16207;--warnsoft:rgba(161,98,7,.1);--err:#B91C1C;--errsoft:rgba(185,28,28,.08);--info:#0369A1;--infosoft:rgba(3,105,161,.09);color-scheme:light}}
:root[data-theme="light"]{--bg:#F3F5F9;--shell:#E9EDF4;--surf:#FFFFFF;--raise:#F6F8FB;--hover:#EDF1F7;--line:rgba(30,41,59,.16);--strong:rgba(30,41,59,.5);--tx:#0F172A;--tx2:#334155;--mut:#64748B;--accsoft:rgba(136,82,252,.12);--ok:#15803D;--oksoft:rgba(21,128,61,.1);--warn:#A16207;--warnsoft:rgba(161,98,7,.1);--err:#B91C1C;--errsoft:rgba(185,28,28,.08);--info:#0369A1;--infosoft:rgba(3,105,161,.09);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Inter","Segoe UI",system-ui,sans-serif;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:auto}
h1{font-size:22px;margin:0 0 4px}.lead{color:var(--mut);margin:0 0 14px;max-width:760px}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pick button{font:inherit;color:var(--tx2);background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.pick button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.pick button:focus-visible,.btn:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.note{color:var(--mut);font-size:13px;max-width:820px;margin:10px 0 0}
.win{background:var(--shell);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;grid-template-columns:230px 1fr;min-height:600px}
.steps{background:var(--surf);border-right:1px solid var(--line);padding:18px 12px}
.brand{font-weight:700;letter-spacing:.02em;margin:0 8px 16px;display:flex;gap:8px;align-items:center}
.logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--acc),var(--info))}
.st{display:flex;gap:10px;padding:8px 10px;border-radius:6px;color:var(--mut)}.st .n{width:20px;text-align:center}
.st.done{color:var(--tx2)}.st.done .n{color:var(--ok)}.st.cur{background:var(--accsoft);color:var(--tx);box-shadow:inset 0 0 0 1px rgba(136,82,252,.42)}
.st em{margin-left:auto;font-style:normal;font-size:11px;color:var(--mut)}
.stage{padding:26px 34px;display:flex;flex-direction:column;min-width:0}
.body{flex:1}
.head{display:flex;gap:12px;align-items:center;margin-bottom:16px}.head h2{margin:0;font-size:20px}.head p{margin:2px 0 0;color:var(--mut)}
.ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--accsoft);color:var(--acc);font-weight:700;font-size:13px}
.ico.watch{background:var(--infosoft);color:var(--info)}.ico.listen{background:var(--oksoft);color:var(--ok)}.ico.read{background:var(--warnsoft);color:var(--warn)}.ico.view{background:var(--errsoft);color:var(--err)}.ico.vault{background:var(--raise);color:var(--tx2);border:1px solid var(--strong)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:22px;padding-top:14px}.foot .r{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;border-radius:7px;padding:7px 16px;border:1px solid var(--strong);background:transparent;color:var(--tx);cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.q{border-color:transparent;color:var(--mut)}.btn.dis{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;gap:6px;align-items:center;padding:2px 9px;border-radius:5px;font-size:12px;border:1px solid var(--line);color:var(--mut)}
.chip.ok{background:var(--oksoft);color:var(--ok);border-color:transparent}.chip.warn{background:var(--warnsoft);color:var(--warn);border-color:transparent}.chip.err{background:var(--errsoft);color:var(--err);border-color:transparent}.chip.info{background:var(--infosoft);color:var(--info);border-color:transparent}.chip.acc{background:var(--accsoft);color:var(--acc);border-color:transparent}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:14px}
.field{margin-bottom:14px}.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}.box{background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:8px 11px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.alert{border-radius:8px;padding:9px 12px;font-size:13px;display:flex;gap:9px;margin-bottom:12px}.alert.warn{background:var(--warnsoft);color:var(--warn)}.alert.err{background:var(--errsoft);color:var(--err)}.alert.ok{background:var(--oksoft);color:var(--ok)}.alert.info{background:var(--infosoft);color:var(--info)}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.trow{display:grid;grid-template-columns:34px 1fr 120px 130px;gap:12px;align-items:center;padding:10px 12px;background:var(--surf);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.trow small,.lrow small{display:block;color:var(--mut)}
table.lib{width:100%;border-collapse:collapse;background:var(--surf);border:1px solid var(--line);border-radius:9px;overflow:hidden}
table.lib th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:9px 12px;border-bottom:1px solid var(--line)}
table.lib td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}table.lib tr:last-child td{border:0}
.cell{display:flex;gap:10px;align-items:center}
.tablewrap{overflow-x:auto}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;justify-items:stretch}@media (max-width:860px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:138px}
.tile .logo2{height:30px;width:60px;border-radius:6px;background:var(--raise);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--mut)}
.tile .push{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:6px}
.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 8px}
.dlgback{background:rgba(0,0,0,.45);border-radius:10px;padding:28px;display:grid;place-items:center}
.dlg{background:var(--raise);border:1px solid var(--strong);border-radius:12px;padding:20px;width:min(460px,100%)}
.dlg.wide{width:min(560px,100%)}
.picker{border:1px solid var(--line);border-radius:8px;background:var(--surf)}
.crumb{padding:8px 11px;border-bottom:1px solid var(--line);color:var(--tx2);font-size:13px}
.plist{max-height:236px;overflow:auto}.plist div{padding:7px 11px;display:flex;gap:8px;border-bottom:1px solid var(--line)}.plist div.sel{background:var(--accsoft)}
.type{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.type div{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;gap:9px;align-items:center;background:var(--surf)}.type div.sel{border-color:var(--acc);background:var(--accsoft)}
.intro{min-height:600px;display:grid;place-items:center;text-align:center;padding:30px;background:radial-gradient(60% 60% at 50% 38%,rgba(136,82,252,.28),transparent 70%),var(--shell)}
.intro .anim{width:120px;height:120px;border-radius:30px;margin:0 auto 18px;background:linear-gradient(135deg,var(--acc),var(--info));opacity:.92}
@media (prefers-reduced-motion:no-preference){.intro .anim{animation:pulse 3.2s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.06);opacity:1}}}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left;margin:20px auto;max-width:760px}
.mk{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--warn);color:#1F1303;font:700 11px/1 system-ui;margin-left:6px;vertical-align:middle}.notes{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px;max-width:860px}.notes li{display:flex;gap:10px;color:var(--tx2);font-size:13.5px}.notes .mk{margin:2px 0 0;flex:none}.cap{color:var(--mut);font-size:13px;margin:10px 0 0}
@media (max-width:860px){.win{grid-template-columns:1fr}.steps{display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.brand{display:none}.st{white-space:nowrap}.two,.three,.type{grid-template-columns:1fr}.stage{padding:20px 16px}.trow{grid-template-columns:30px 1fr}.trow .c3,.trow .c4{grid-column:2}}
</style>
<div class="wrap">
<h1>First-run setup rework</h1>
<p class="lead">Mockups for the plan "first-run-setup-rework" (Draft). Wireframe-level: layout, words and order matter, exact colours follow the design system. Pick a screen.</p>
<div class="pick" id="pick" role="tablist"></div>
<div id="screen"></div>
<div class="note" id="cap"></div>
</div>
<script>
const steps=(cur,done,opt={})=>{const L=['Your Library','Your profile','Tools','Vault','Libraries','Metadata','All set'];return `<aside class="steps"><div class="brand"><span class="logo"></span>Library</div>${L.map((n,i)=>{const c=i===cur?'cur':(i<cur?'done':'');return `<div class="st ${c}"><span class="n">${i<cur?'✓':i+1}</span>${n}${i===3?'<em>optional</em>':''}</div>`}).join('')}</aside>`};
const foot=(l,r)=>`<div class="foot"><div>${l}</div><div class="r">${r}</div></div>`;
const win=(cur,inner)=>`<div class="win">${steps(cur)}<section class="stage"><div class="body">${inner}</div></section></div>`;
const head=(c,i,t,p)=>`<div class="head"><span class="ico ${c}">${i}</span><div><h2>${t}</h2><p>${p}</p></div></div>`;
const S={
intro:{t:'0 Welcome',c:'Full-screen intro before the seven steps. The animation plays at the top (recoloured to the Tuvima palette; a placeholder stands here) and ends on the tagline. Client-side only, no new Engine step. The documentation link opens docs.tuvima.com in a new tab so setup is never left.',h:()=>`<div class="win" style="grid-template-columns:1fr"><div class="intro"><div><div class="anim"></div><div style="letter-spacing:.22em;color:var(--tx2);font-size:12px;margin-bottom:6px">TUVIMA LIBRARY</div><h2 style="font-size:34px;margin:0 0 8px;line-height:1.15">One Library. Every Story.</h2><p style="color:var(--tx2);max-width:560px;margin:0 auto;font-size:16px">The movies, shows, music, books and photos you already own, found, matched and brought together in one beautiful place that is yours.</p><div class="three"><div class="panel" style="text-align:left"><span class="ico watch" style="width:46px;height:46px;border-radius:13px;margin-bottom:10px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span><br><b style="font-size:16px">Find</b><br><span style="color:var(--mut)">Point Library at your folders. It reads what is already there and leaves your files alone.</span></div><div class="panel" style="text-align:left"><span class="ico listen" style="width:46px;height:46px;border-radius:13px;margin-bottom:10px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></span><br><b style="font-size:16px">Connect</b><br><span style="color:var(--mut)">It recognises each title, adds artwork and details, and links books, films and shows from the same story.</span></div><div class="panel" style="text-align:left"><span class="ico " style="width:46px;height:46px;border-radius:13px;margin-bottom:10px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5.5 3.5-5.5 3.5z" fill="currentColor"/></svg></span><br><b style="font-size:16px">Enjoy</b><br><span style="color:var(--mut)">Browse, watch, listen and read on any device at home. Setup takes about five minutes.</span></div></div><div class="panel" style="max-width:640px;margin:0 auto 18px;text-align:left;display:flex;gap:12px;align-items:flex-start"><span class="ico listen" style="width:30px;height:30px">🔒</span><div><b>Private by default</b><br><span style="color:var(--mut)">Library runs on your own computer. Your files and details stay on your server, and nothing is sent anywhere unless you turn on a service that needs it. <a style="color:var(--info)" href="#intro">Read how privacy works ↗</a></span></div></div><button class="btn p">Get started</button> <button class="btn q">Restore a backup instead</button></div></div></div>`},
name:{t:'1 Your Library',c:'Today\'s Welcome page, renamed. Name, language and region only. The note about details staying on the server moved to the intro. The Change button gets an outline and a Cancel (small bug build).',h:()=>win(0,head('','L','Name your Library','Pick a language and a name. Phones and TVs will find it by this name.')+`<div class="two"><div class="field"><label>Display language</label><div class="box">English</div></div><div class="field"><label>Region</label><div class="box">United Kingdom</div></div></div><div class="field"><label>What should we call this Library?</label><div class="box">Shy's Library</div></div><div class="panel" style="color:var(--mut)">Phones and TVs on your home network will find it at <b style="color:var(--tx)">shys-library.local</b> <button class="btn" style="padding:2px 10px;margin-left:6px">Change</button></div>`+foot('',`<button class="btn p">Continue →</button>`))},
tools:{t:'3 Tools',c:'The summary becomes coloured chips with the detail (what each one is for), like Settings › Tools. Same shared row as Settings.',h:()=>win(2,head('','T','Tools','Library uses a few helper tools to read your media.')+`<div class="sum"><span class="chip ok">✓ 4 ready</span><span class="chip warn">1 needs setup</span><span class="chip info">1 downloading 62%</span></div>`+[['FFmpeg','6.1 · plays and reads video and audio','ok','Ready',''],['ExifTool','12.7 · reads photo and file details','ok','Ready',''],['Image engine','built in · makes artwork and thumbnails','ok','Ready',''],['Tesseract','not installed · reads text in scanned documents','warn','Not installed','Download'],['Local AI','set up later in Settings › Local AI','','Later','']].map(r=>`<div class="trow"><span class="ico" style="width:30px;height:30px">${r[0][0]}</span><div><b>${r[0]}</b><small>${r[1]}</small></div><div class="c3"><span class="chip ${r[2]}">${r[3]}</span></div><div class="c4" style="text-align:right">${r[4]?`<button class="btn">${r[4]}</button>`:''}</div></div>`).join('')+foot('<button class="btn q">← Back</button>',`<button class="btn">Check again</button><button class="btn p">Continue →</button>`))},
vault:{t:'4 Vault',c:'Moves BEFORE Libraries. Plain purpose, and it says outright that adult content is enabled here. Turning it on is what makes the Vault kinds (adult videos and pictures) appear in Add library later. Shown only to the first administrator on a desktop or tablet. Not now leaves no trace.',h:()=>win(3,head('vault','V','Turn on the Vault?','A private, PIN-locked space for anything you want to hide, including adult content.')+`<div class="panel"><b>What the Vault is for</b><p style="color:var(--tx2);margin:6px 0 10px">Put anything in the Vault that you want to keep hidden: private videos, pictures and more. Adult content is enabled here and only here. Nothing adult appears anywhere else in Library, and it is off until you turn it on.</p><b>What turning it on unlocks</b><ul style="color:var(--tx2);margin:6px 0 0"><li>Vault becomes a choice when you add a library, for videos and pictures you want hidden, adult content included.</li><li>Everything in the Vault is locked behind its own PIN.</li><li>It stays hidden from kids profiles, and from other profiles unless they have the PIN.</li></ul></div><p class="cap">You can turn it on later in Settings.</p>`+foot('<button class="btn q">← Back</button>',`<button class="btn q">Not now</button><button class="btn p">Turn on the Vault</button>`))},
libs:{t:'5 Libraries',c:'Replaces the four area cards. One Add library button, one table: name, area, folders, status. Same layout as Settings › Libraries (which shows "in your collection" and scanning); in setup the status is "Pending" and the collection count is hidden. Vault rows only if the Vault is on.',h:()=>win(4,head('','▤','What do you have?','Add a library for each kind of media. Scanning starts when setup ends.')+`<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn p">+ Add library</button></div><div class="tablewrap"><table class="lib"><thead><tr><th>Library</th><th>Area</th><th>Folders</th><th>Status</th><th></th></tr></thead><tbody>`+[['Movies','watch','Watch','1','M'],['TV Shows','watch','Watch','2','T'],['Music','listen','Listen','1','♪'],['Photos','view','View','3','P']].map(r=>`<tr><td><div class="cell"><span class="ico ${r[1]}" style="width:30px;height:30px">${r[4]}</span><b>${r[0]}</b></div></td><td>${r[2]}</td><td>${r[3]}</td><td><span class="chip">Pending</span></td><td style="text-align:right;color:var(--mut)">Edit · Remove</td></tr>`).join('')+`</tbody></table></div>`+foot('<button class="btn q">← Back</button>',`<button class="btn p">Continue →</button>`))},
add0:{t:'5a Add library · area',c:'Step 1: a list of large horizontal rows, one per area, each with its icon, colour and a fuller description. A new area is one more row. Vault appears only when the Vault step turned it on.',h:()=>`<div class="dlgback"><div class="dlg wide" style="width:min(640px,100%)"><h2 style="margin:0 0 4px;font-size:18px">What would you like to add?</h2><p style="color:var(--mut);margin:0 0 14px">Step 1 of 4 · choose an area</p><div class="panel" style="display:flex;gap:14px;align-items:center;padding:14px 16px;margin-bottom:8px; border-color:var(--acc);background:var(--accsoft);"><span class="ico watch" style="width:44px;height:44px;font-size:16px">▶</span><div style="flex:1;min-width:0"><b style="font-size:15px">Watch</b><br><span class="cap" style="margin:0">Movies and TV shows. Films, series, seasons and episodes, with posters and cast.</span></div><span style="color:var(--mut)">›</span></div><div class="panel" style="display:flex;gap:14px;align-items:center;padding:14px 16px;margin-bottom:8px;"><span class="ico listen" style="width:44px;height:44px;font-size:16px">♪</span><div style="flex:1;min-width:0"><b style="font-size:15px">Listen</b><br><span class="cap" style="margin:0">Music and audiobooks. Albums, artists, narrators and chapters.</span></div><span style="color:var(--mut)">›</span></div><div class="panel" style="display:flex;gap:14px;align-items:center;padding:14px 16px;margin-bottom:8px;"><span class="ico read" style="width:44px;height:44px;font-size:16px">B</span><div style="flex:1;min-width:0"><b style="font-size:15px">Read</b><br><span class="cap" style="margin:0">Books and comics. EPUBs, PDFs, audiobooks-with-text and comic archives.</span></div><span style="color:var(--mut)">›</span></div><div class="panel" style="display:flex;gap:14px;align-items:center;padding:14px 16px;margin-bottom:8px;"><span class="ico view" style="width:44px;height:44px;font-size:16px">◧</span><div style="flex:1;min-width:0"><b style="font-size:15px">View</b><br><span class="cap" style="margin:0">Your personal things: photos, personal videos and documents. Kept per person, organised by date and place.</span></div><span style="color:var(--mut)">›</span></div><div class="panel" style="display:flex;gap:14px;align-items:center;padding:14px 16px;margin-bottom:8px;"><span class="ico vault" style="width:44px;height:44px;font-size:16px">V</span><div style="flex:1;min-width:0"><b style="font-size:15px">Vault</b><br><span class="cap" style="margin:0">Anything you want to keep hidden, locked behind the Vault PIN: adult content, private videos, pictures and more.</span></div><span class="chip" title="Shown only after you turn on the Vault earlier in setup (or later in Settings). Vault libraries are locked behind their own PIN and hidden from kids profiles." style="cursor:help;width:24px;height:24px;justify-content:center;border-radius:50%;padding:0" tabindex="0" aria-label="Why is this here? Shown only after you turn on the Vault earlier in setup, or later in Settings. Vault libraries are locked behind their own PIN and hidden from kids profiles.">i</span><span style="color:var(--mut)">›</span></div>${foot('<button class="btn q">Cancel</button>','<button class="btn p">Next →</button>')}</div></div>`},
add1:{t:'5b Add library · type',c:'Step 2: the same large rows, now the types in the chosen area (Watch shown). A new type is one more row, so the screen never looks sparse.',h:()=>`<div class="dlgback"><div class="dlg wide" style="width:min(640px,100%)"><h2 style="margin:0 0 4px;font-size:18px">What kind of Watch library?</h2><p style="color:var(--mut);margin:0 0 14px">Step 2 of 4 · choose a type</p><div class="panel" style="display:flex;gap:14px;align-items:center;padding:14px 16px;margin-bottom:8px; border-color:var(--acc);background:var(--accsoft);"><span class="ico watch" style="width:44px;height:44px;font-size:16px">M</span><div style="flex:1;min-width:0"><b style="font-size:15px">Movies</b><br><span class="cap" style="margin:0">Feature films. One folder per film, or all films together; Library works out the rest.</span></div><span style="color:var(--mut)">›</span></div><div class="panel" style="display:flex;gap:14px;align-items:center;padding:14px 16px;margin-bottom:8px;"><span class="ico watch" style="width:44px;height:44px;font-size:16px">T</span><div style="flex:1;min-width:0"><b style="font-size:15px">TV Shows</b><br><span class="cap" style="margin:0">Series with seasons and episodes, including extras and specials.</span></div><span style="color:var(--mut)">›</span></div>${foot('<button class="btn q">← Back</button>','<button class="btn p">Next →</button>')}</div></div>`},
add2a:{t:'5c Folder · start',c:'',h:()=>`<div class="dlgback"><div class="dlg wide"><h2 style="margin:0 0 4px;font-size:18px">Choose the Movies folder</h2><p style="color:var(--mut);margin:0 0 12px">Step 3 of 4</p><div class="picker"><div class="crumb" style="display:flex;justify-content:space-between"><span>This server</span><span style="color:var(--mut)">⌨ Type a path</span></div><div class="plist" style="max-height:none"><div class="sec" style="margin:0;padding:7px 11px;border-bottom:1px solid var(--line)">Media locations</div><div>📁 Library (Tuvima's own folder)</div><div class="sec" style="margin:0;padding:7px 11px;border-bottom:1px solid var(--line)">Drives on this server</div><div>💽 C:</div><div>💽 D:</div><div>💽 Z: &nbsp;<span style="color:var(--mut)">NAS (network drive)</span></div></div></div>${foot('<button class="btn q">← Back</button>','<button class="btn p" style="opacity:.45">Add library</button>')}</div></div>`},
add2:{t:'5d Folder · inside a drive',c:'',h:()=>`<div class="dlgback"><div class="dlg wide"><h2 style="margin:0 0 4px;font-size:18px">Choose the Movies folder</h2><p style="color:var(--mut);margin:0 0 12px">Step 3 of 4</p><div class="picker"><div class="crumb" style="display:flex;justify-content:space-between"><span>This server › Z: › Media › <b style="color:var(--tx)">Movies</b></span><span style="color:var(--mut)">⌨ Type a path</span></div><div class="plist"><div>📁 ..</div><div>📁 Action</div><div>📁 Animation</div><div class="sel">📁 Movies</div><div>📁 Music</div><div>📁 Photos</div><div>📁 TV Shows</div></div></div><div class="field" style="margin-top:12px"><label>Library name</label><div class="box">Movies</div></div>${foot('<button class="btn q">← Back</button>','<button class="btn p">Add library</button>')}</div></div>`},
add2b:{t:'5e Folder · type a path',c:'',h:()=>`<div class="dlgback"><div class="dlg wide"><h2 style="margin:0 0 4px;font-size:18px">Choose the Movies folder</h2><p style="color:var(--mut);margin:0 0 12px">Step 3 of 4</p><div class="picker"><div class="crumb"><div class="box" style="font-family:ui-monospace,monospace">\\\\nas\\media\\Movies</div></div><div class="plist"><div style="color:var(--mut)">Press Enter to go to this folder</div></div></div><div class="field" style="margin-top:12px"><label>Library name</label><div class="box">Movies</div></div>${foot('<button class="btn q">← Back</button>','<button class="btn p">Add library</button>')}</div></div>`},
add3:{t:'5f Check · looks right',c:'',h:()=>`<div class="dlgback"><div class="dlg wide"><h2 style="margin:0 0 4px;font-size:18px">Checking Z:\\Media\\Movies</h2><p style="color:var(--mut);margin:0 0 12px">Step 4 of 4</p><div class="alert ok">✓ Looks right. 412 video files found, most look like movies.</div>${foot('<button class="btn q">← Change folder</button>','<button class="btn p">Done</button>')}</div></div>`},
add3b:{t:'5g Check · heads up',c:'',h:()=>`<div class="dlgback"><div class="dlg wide"><h2 style="margin:0 0 4px;font-size:18px">Checking Z:\\Media\\Movies</h2><p style="color:var(--mut);margin:0 0 12px">Step 4 of 4</p><div class="alert warn">⚠ Heads up. This folder holds mostly music files. You can still add it as Movies, or go back and change the kind.</div>${foot('<button class="btn q">← Change folder</button>','<button class="btn p">Done</button>')}</div></div>`},
add3c:{t:'5h Check · already used',c:'',h:()=>`<div class="dlgback"><div class="dlg wide"><h2 style="margin:0 0 4px;font-size:18px">Checking Z:\\Media\\Movies</h2><p style="color:var(--mut);margin:0 0 12px">Step 4 of 4</p><div class="alert err">✕ Already used. Z:\\Media\\Movies is already part of your Movies library. Choose a different folder.</div>${foot('<button class="btn q">← Change folder</button>','<button class="btn p dis">Done</button>')}</div></div>`},
meta:{t:'6 Metadata',c:'Tiles for sources that need a key come first, then the ones that do not. Every tile is the same size, three to a row at most, left-aligned, so five ready tiles sit 3 then 2. The "no source" warning does not show here: rows say Pending, and the warning only appears on All set if still no source by the end.',h:()=>win(5,head('','M','Where should Library look things up?','Sources that need a free key are first. Connect the ones you want.')+`<div class="sec">Needs a key</div><div class="tiles">`+[['TMDB','Movies and TV'],['Comic Vine','Comics'],['Fanart.tv','Artwork']].map(n=>`<div class="tile"><div class="logo2">${n[0][0]}</div><div><b>${n[0]}</b><br><span style="color:var(--mut);font-size:12px">${n[1]}</span></div><div class="push"><span class="chip warn">Needs a key</span><button class="btn" style="padding:4px 12px">Connect</button></div></div>`).join('')+`</div><div class="sec">Ready, no key needed</div><div class="tiles">`+[['Wikidata','Everything'],['MusicBrainz','Music'],['Open Library','Books'],['Apple','Music, podcasts'],['TheAudioDB','Music artwork']].map(n=>`<div class="tile"><div class="logo2">${n[0][0]}</div><div><b>${n[0]}</b><br><span style="color:var(--mut);font-size:12px">${n[1]}</span></div><div class="push"><span class="chip ok">✓ No key needed</span></div></div>`).join('')+`</div>`+foot('<button class="btn q">← Back</button>',`<button class="btn q">Skip for now</button><button class="btn p">Continue →</button>`))},
key:{t:'6a Connect a source',c:'One dialog for every source. A source can need one field or several; the dialog draws what that source declares. Before a passing test the buttons are Test (active) and Save (off); this view shows the passed state. "Atlas" in your target images was a stand-in, so this uses TMDB.',h:()=>`<div class="dlgback"><div class="dlg"><h2 style="margin:0 0 4px;font-size:18px">Connect TMDB</h2><p style="color:var(--mut);margin:0 0 12px">Free key from themoviedb.org. It stays on your server.</p><div class="field"><label>API key</label><div class="box">••••••••••••••••••••••••</div></div><div class="alert ok">✓ Connected. TMDB answered and the key works.</div>${foot('<button class="btn q">Cancel</button>','<button class="btn">Test again</button><button class="btn p">Save</button>')}</div></div>`},
done:{t:'7 All set',c:'One row per step with its state. The held-import warning shows here only if no metadata source is on by the end.',h:()=>win(6,head('','✓','All set','Here is how setup went.')+`<div class="alert warn">⚠ Movies and TV Shows will wait to be identified until a metadata source is switched on. <a style="color:inherit">Turn one on</a></div>`+[['Your Library','Shy\'s Library','ok','Done'],['Your profile','Shy','ok','Done'],['Tools','4 ready, Tesseract later','ok','Done'],['Vault','Not turned on','','Later'],['Libraries','4 libraries, 7 folders','ok','Done'],['Metadata','Wikidata, MusicBrainz','warn','Needs attention']].map(r=>`<div class="trow" style="grid-template-columns:1fr 1fr 140px"><b>${r[0]}</b><span style="color:var(--mut)">${r[1]}</span><span class="chip ${r[2]}">${r[3]}</span></div>`).join('')+foot('',`<button class="btn p">Open my library</button>`))},
splash:{t:'App launch splash',c:'The same animation, short, shown while the Dashboard connects to the Engine. It never delays a ready app and never plays longer than the connection takes.',h:()=>`<div class="win" style="grid-template-columns:1fr"><div class="intro"><div><div class="anim"></div><div style="letter-spacing:.2em;color:var(--tx2)">LIBRARY</div></div></div></div>`}
};
const order=['intro','name','tools','vault','libs','add0','add1','add2a','add2','add2b','add3','add3b','add3c','meta','key','done','splash'];

const NOTES={
intro:[['Your animation plays here, recoloured to the Tuvima palette, and ends on the tagline. A placeholder stands in until the build converts the file.','TUVIMA LIBRARY'],['The marketing tagline. One friendly sentence under it says what Library does.','One Library. Every Story.'],['Three cards with friendly icons say what setup does: Find, Connect, Enjoy. Setup takes about five minutes.','Find'],['Private by default. The link opens docs.tuvima.com in a new tab so setup is never left.','Private by default'],['Get started opens the seven steps. Restore a backup instead stays beside it. This intro is Dashboard-only and is skipped on reload once setup has begun.','Get started']],
name:[['Name, language and region only. The old Welcome form, now step 1.','What should we call this Library?'],['The network name is derived from the name. Change gets an outline and a Cancel (small bug build).','Phones and TVs']],
tools:[['Coloured summary chips, the same ones Settings shows.','✓ 4 ready'],['One shared row per tool with a line saying what it is for. Download appears on a missing optional tool and starts the download; Continue is never blocked.','FFmpeg']],
vault:[['Shown only to the first administrator on a desktop or tablet. It now comes before Libraries so Vault is a choice in Add library only when on.','Turn on the Vault?'],['Says plainly what the Vault is for and what it unlocks. Adult content is enabled here and only here.','What the Vault is for'],['Not now leaves no trace: no Vault step entry, no Vault choices later. It can be turned on in Settings.','Not now']],
libs:[['One button opens the four-step Add library wizard.','+ Add library'],['In setup the status is Pending and the collection count is hidden. Settings › Libraries uses this same table and shows Scanning and counts. Vault rows appear only if the Vault is on.','Status']],
add0:[['Large rows, one per area. A new area later is one more row.','What would you like to add?'],['The (i) shows on mouseover or keyboard focus. The Vault row appears only when the Vault is on. Tooltip text: Shown only after you turn on the Vault earlier in setup, or later in Settings. Vault libraries are locked behind their own PIN and hidden from kids profiles.','i']],
add1:[['The types of the chosen area (Watch shown), in a fixed order. A new type is one more row.','What kind of Watch library?']],
add2a:[['The start view lists the drives on this server, and any media locations already set up. This is the same list the current picker opens on.','Drives on this server'],['Type a path lets you paste a folder path instead of clicking.','Type a path']],
add2:[['The breadcrumb always leads back to This server. A plain list of folders, fixed height. Nothing is scanned or counted while browsing, so it opens at once.','This server ›'],['The library name is pre-filled from the type and can be changed.','Library name']],
add2b:[['Typing or pasting a path, including a network path such as \\\\nas\\media\\Movies, then Enter jumps straight there. It works for any location the server itself can reach.','nas']],
add3:[['After Add, Library looks inside the folder. Here the contents match the chosen kind.','Looks right']],
add3b:[['The contents do not match the chosen kind. The person can still add it or go back.','Heads up']],
add3c:[['The only hard error: this exact folder is already part of another library. Done is disabled until a different folder is chosen. Path names such as Movies or TV are never a problem.','Already used']],
meta:[['Sources that need a key come first. Tiles are the same size, at most three per row, left-aligned. Mid-setup no warning appears about identification; it shows on All set only if no source is on at the end.','Needs a key'],['Sources that need no key. Five tiles sit 3 then 2. On a phone the tiles stack.','Ready, no key needed']],
key:[['One dialog for every source. A source may need one field or several; the dialog draws the fields that source declares.','API key'],['Test runs against the source. Before a passing test the buttons are Test (active) and Save (off); this view shows the passed state.','Connected'],['Save is available only after a passing test.','Save']],
done:[['Shown only if no metadata source is on by the end of setup. Otherwise this row is a tick.','Movies and TV Shows']],
splash:[['The same animation, short, while the Dashboard connects to the Engine. It never delays a ready app.','LIBRARY']]
};
function mark(root,text,n){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let t;while(t=w.nextNode()){if(t.nodeValue.includes(text)&&(text.length>1||t.nodeValue.trim()===text)){const m=document.createElement('i');m.className='mk';m.textContent=n;t.parentNode.appendChild(m);return}}}
function annotate(k){const n=NOTES[k];if(!n){cap.textContent=S[k].c;return}n.forEach((x,i)=>mark(scr,x[1],i+1));cap.innerHTML='<ol class="notes">'+n.map((x,i)=>`<li><i class="mk">${i+1}</i><span>${x[0]}</span></li>`).join('')+'</ol>'}
const pick=document.getElementById('pick'),scr=document.getElementById('screen'),cap=document.getElementById('cap');
function show(k){if(!S[k])k='intro';scr.innerHTML=S[k].h();annotate(k);[...pick.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));try{history.replaceState(null,'','#'+k)}catch(e){}}
order.forEach(k=>{const b=document.createElement('button');b.textContent=S[k].t;b.dataset.k=k;b.setAttribute('role','tab');b.onclick=()=>show(k);pick.appendChild(b)});
show((location.hash||'').slice(1)||'intro');
</script>
