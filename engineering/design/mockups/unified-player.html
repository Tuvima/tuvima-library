<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unified player mockup</title>
<style>
:root{--bg:#070A12;--surf:#0B1020;--panel:#151B2C;--acc:#8852FC;--t1:#F5F7FB;--t2:#B6C2D6;--t3:#94A3B8;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t1);font:15px/1.45 system-ui,sans-serif;padding:24px 16px 64px}
main{max-width:1100px;margin:0 auto}h1{font-size:22px;margin:0 0 4px}p.lead{color:var(--t2);margin:0 0 28px}
figure{margin:0 0 40px}figcaption{margin-top:12px;color:var(--t2);font-size:14px}figcaption b{color:var(--t1)}
figcaption ol{margin:6px 0 0;padding-left:20px}
.screen{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#1b2447,#2d1b4a 60%,#10162a);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.m{position:absolute;z-index:9;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font:700 12px/22px sans-serif;text-align:center;box-shadow:0 0 0 2px #070A12}
.bar{position:absolute;left:0;right:0;bottom:0;padding:0 28px 18px;background:linear-gradient(transparent,rgba(0,0,0,.85) 45%)}
.rail{height:5px;background:rgba(255,255,255,.25);border-radius:3px;position:relative;margin:30px 0 8px}
.rail i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:3px}
.rail u{position:absolute;top:-4px;width:13px;height:13px;border-radius:50%;background:var(--acc);margin-left:-6px}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--t2)}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:6px}
.title{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title small{display:block;font-size:13px;color:var(--t2);font-weight:400}
.mid{display:flex;gap:18px;align-items:center}.right{display:flex;gap:14px;justify-content:flex-end;align-items:center}
.btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--t1);position:relative;font-weight:600}
.btn.play{width:56px;height:56px;background:#fff;color:#000;font-size:20px}
.btn.t{font-size:11px;color:var(--t2);border:1.5px solid var(--t3);border-radius:10px;width:44px;height:36px}
.btn.on:after{content:"Skip back";position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#000;border-radius:6px;padding:3px 8px;font-size:12px;white-space:nowrap;font-weight:400}
.btn.on{transform:scale(1.12)}
.btn.on.b2:after{content:"Play"}.btn.on.b3:after{content:"Next episode"}
.panel{position:absolute;background:var(--panel);border-radius:12px;border:1px solid var(--line);box-shadow:0 12px 36px rgba(0,0,0,.55);padding:8px}
.prow{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:8px;font-size:15px}
.prow span{color:var(--t3)}.prow.sel{background:rgba(136,82,252,.18)}
.phead{display:flex;gap:10px;align-items:center;padding:8px 12px 10px;font-weight:600;border-bottom:1px solid var(--line);margin-bottom:4px}
.vol{width:56px;height:150px;background:var(--panel);border-radius:10px;position:absolute;display:flex;justify-content:center;padding:12px 0}
.trk{width:8px;background:rgba(255,255,255,.22);border-radius:4px;position:relative}.trk i{position:absolute;left:0;right:0;bottom:0;background:var(--acc);border-radius:4px}.trk u{position:absolute;left:-5px;width:18px;height:18px;border-radius:50%;background:#fff;bottom:62%}
.cover{position:absolute;border-radius:8px;background:linear-gradient(160deg,#8852FC,#38BDF8);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.pause{position:absolute;inset:0;background:rgba(0,0,0,.88)}
.pause .txt{position:absolute;left:11%;top:22%;right:12%}
.pause .k{color:var(--t2);font-size:15px}.pause h2{font-size:54px;margin:2px 0 0;line-height:1.05}.pause h3{margin:6px 0 22px;font-size:20px}.pause h4{margin:0 0 6px;font-size:19px}.pause p{margin:0;color:var(--t2);max-width:760px}
.rate{position:absolute;left:5%;top:8%;border-left:4px solid var(--acc);padding-left:14px}.rate b{display:block;font-size:19px;letter-spacing:.02em}.rate span{color:var(--t2)}
.chip{background:rgba(136,82,252,.35);border-radius:6px;padding:1px 8px;font-size:13px}.brow{display:grid;grid-template-columns:68px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.brow small{display:block;color:var(--t3);font-size:12px}.tm{background:var(--acc);border-radius:8px;padding:6px 0;text-align:center}
.ft{flex:1;background:#232c42;border-radius:6px;text-align:center;padding:8px 0}
</style></head><body><main>
<h1>Unified player</h1><p class="lead">One layout for video, audiobook and music. Draft mockups; the numbered circles are reference markers only and do not appear in the app.</p>

<figure><div class="screen">
 <div class="m" style="left:6px;bottom:38px">1</div><div class="m" style="left:calc(50% - 11px);bottom:92px">2</div><div class="m" style="right:6px;bottom:38px">3</div><div class="m" style="left:6px;bottom:84px">4</div>
 <div class="bar"><div class="rail"><i style="width:34%"></i><u style="left:34%"></u></div><div class="times"><span>0:22:41</span><span>1:05:12 left</span></div>
 <div class="row"><div class="title">Tires<small>Season 3 · It Often Rhymes</small></div>
 <div class="mid"><div class="btn">⏮</div><div class="btn on">⟲10</div><div class="btn play on b2" style="transform:scale(1.12)">▶</div><div class="btn">10⟳</div><div class="btn on b3" style="transform:none">⏭</div></div>
 <div class="right"><div class="btn t">Eps</div><div class="btn t">🔖</div><div class="btn t">🔊</div><div class="btn t">Aa</div><div class="btn t">⚙</div></div></div></div>
</div><figcaption><b>Video (TV episode), playing, mouse over Skip back.</b><ol><li>Title and episode at the left, in the same place in every player.</li><li>Previous, skip back, Play, skip forward, next: Play in the middle. Every button grows the same small amount and shows its name above it; none gets a highlight.</li><li>Tools for this media on the right: Episodes, Bookmarks, Volume, Subtitle style (Aa), Settings.</li><li>Progress bar with time played and time left.</li></ol></figcaption></figure>

<figure><div class="screen">
 <div class="cover" style="left:12%;top:14%;width:26%;aspect-ratio:1"></div>
 <div style="position:absolute;left:44%;top:18%;right:8%"><div style="color:var(--t2)">Chapter 4 of 21</div><div style="font-size:40px;font-weight:700;line-height:1.1;margin:4px 0">The Long Way Round</div><div style="color:var(--t2)">Dune · Frank Herbert · Narrated by Scott Brick</div></div>
 <div class="m" style="left:6px;bottom:38px">1</div><div class="m" style="left:calc(50% - 11px);bottom:92px">2</div><div class="m" style="right:6px;bottom:38px">3</div><div class="m" style="left:6px;bottom:84px">4</div>
 <div class="bar"><div class="rail"><i style="width:48%"></i><u style="left:48%"></u></div><div class="times"><span>12:08 in this chapter</span><span>9:41 left in chapter · 6h 12m left in book &nbsp; <b style="border:1px solid var(--t3);border-radius:6px;padding:1px 6px">Chapter | Book</b></span></div>
 <div class="row"><div class="title">The Long Way Round<small>Dune</small></div>
 <div class="mid"><div class="btn">⏮</div><div class="btn">⟲15</div><div class="btn play">▶</div><div class="btn">30⟳</div><div class="btn">⏭</div></div>
 <div class="right"><div class="btn t">Ch.</div><div class="btn t">1×</div><div class="btn t">Zzz</div><div class="btn t">🔖</div><div class="btn t">🔊</div><div class="btn t">⚙</div></div></div></div>
</div><figcaption><b>Audiobook, playing.</b><ol><li>Same bar as video: title left, Play in the middle, tools right.</li><li>Previous and next now mean chapter; skip back and forward keep their own times.</li><li>Chapters, Speed, Sleep timer, Bookmarks, Volume, Settings on the right.</li><li>The bar shows the current chapter by default; the Chapter | Book switch flips it to the whole book, which has no tick marks.</li></ol></figcaption></figure>

<figure><div class="screen"><div class="panel" style="right:5%;bottom:90px;width:380px;max-height:62%"><div class="phead">Chapters <span style="margin-left:auto;color:var(--t3);font-weight:400">21</span></div>
 <div class="prow">3 · Arrakis Awakens<span>14:20</span></div><div class="prow sel">4 · The Long Way Round<span>21:49</span></div><div class="prow">5 · Sietch Tabr<span>18:02</span></div><div class="prow">6 · The Test<span>25:30</span></div><div class="prow">7 · Water Discipline<span>19:11</span></div></div>
 <div class="m" style="right:calc(5% + 388px);bottom:240px">1</div><div class="m" style="right:5%;bottom:84px;top:auto;margin:0;transform:translate(0,0);display:none">2</div></div>
<figcaption><b>Chapters panel (audiobook).</b><ol><li>Pick a chapter from the list; the current one is highlighted and the list opens scrolled to it. Fits its content, one scrolling list only when there are many chapters.</li></ol></figcaption></figure>

<figure><div class="screen"><div class="pause"><div class="rate"><b>RATED TV-MA</b><span>nudity, language, smoking</span></div>
 <div class="txt"><h2>Tires</h2><h3>Season 3</h3><h4>It Often Rhymes: Ep. 1</h4><p>Will pitches a commercial to boost sales, but Phil counters with a more immediate way to cut costs. A familiar face on a dating app catches Shane's eye.</p></div></div>
 <div class="m" style="left:2%;top:4%">1</div><div class="m" style="left:8%;top:18%">2</div></div>
<figcaption><b>Video, paused for a few seconds.</b><ol><li>Rating card at the top left with an accent bar; the reasons line appears only when a source supplies it.</li><li>Left-aligned details: title, season, episode title and number, description. A film shows its year and length instead of the season line; audiobooks and music use the same idea (next picture). Press Play or move the mouse to bring the bar back.</li></ol></figcaption></figure>

<figure><div class="screen">
 <div class="vol" style="right:calc(5% + 4px);bottom:108px"><div class="trk"><i style="height:62%"></i><u></u></div></div>
 <div class="bar"><div class="row"><div></div><div class="mid"><div class="btn play">▶</div></div><div class="right"><div class="btn t">🔊</div><div class="btn t">⚙</div></div></div></div>
 <div class="m" style="right:calc(5% + 66px);bottom:200px">1</div><div class="m" style="right:calc(5% + 4px);bottom:36px;display:none">2</div></div>
<figcaption><b>Volume (video, audiobook, music).</b><ol><li>A dark rounded box above the speaker with a thick vertical track, an accent fill and a round knob. A click anywhere on the track sets the level. The speaker shows sound on until you mute it, or turn the volume to zero.</li></ol></figcaption></figure>

<figure><div class="screen"><div class="panel" style="right:3%;bottom:90px;width:380px"><div class="phead">Settings</div>
 <div class="prow">Audio<span>English 5.1 ›</span></div><div class="prow">Subtitles<span>Off ›</span></div><div class="prow">Playback speed<span>1× ›</span></div><div class="prow">Show bookmarks on the bar<span>Off</span></div></div>
 <div class="m" style="right:calc(3% + 388px);bottom:340px">1</div></div>
<figcaption><b>Settings (video).</b><ol><li>One wider panel, label on the left and the current choice on the right, soft spacing instead of boxed borders, opens each page in place with a back arrow. Fits its content; no scroll bars.</li></ol></figcaption></figure>
<figure><div class="screen"><div class="panel" style="right:3%;top:5%;width:400px;padding:16px">
 <div style="display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700">🔖 Bookmarks <span class="chip">4</span><span style="margin-left:auto;font-weight:400">✕</span></div>
 <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px"><span>Show on timeline</span><span style="width:40px;height:22px;border-radius:11px;background:var(--acc);position:relative"><i style="position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff"></i></span></div>
 <div style="border:1.5px solid var(--acc);border-radius:8px;text-align:center;padding:9px;font-weight:600">+ Bookmark at 04:55</div>
 <div style="display:flex;gap:22px;border-bottom:1px solid var(--line);margin:14px 0 10px;padding-bottom:8px"><b style="border-bottom:2px solid var(--acc);padding-bottom:6px">Mine <span class="chip">4</span></b><span style="color:var(--t3)">Global <span class="chip" style="background:#2a3348">2</span></span></div>
 <div style="border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--t3);margin-bottom:6px">🔍 Search bookmarks</div>
 <div class="brow"><b class="tm">02:18</b><div>Opening aerial shot<small>Personal</small></div><span>✎ 🗑</span></div>
 <div class="brow"><b class="tm">04:55</b><div>The lighthouse comes into view<small>Personal</small></div><span>✎ 🗑</span></div>
 <div class="brow"><b class="tm">12:40</b><div>Return to this explanation<small>Personal</small></div><span>✎ 🗑</span></div>
 <div class="brow"><b class="tm">23:07</b><div>Great sunset shot<small>Personal</small></div><span>✎ 🗑</span></div>
 <div style="color:var(--t3);font-size:13px;padding-top:10px">▶ Select a time to jump to that moment.</div></div>
 <div class="m" style="right:calc(3% + 408px);top:5%">1</div><div class="m" style="right:calc(3% + 408px);top:22%">2</div><div class="m" style="right:calc(3% + 408px);top:46%">3</div></div>
<figcaption><b>Bookmarks panel (all three players).</b><ol><li>Count chip, a "Show on timeline" switch and a full-width add button showing the current time.</li><li>Mine and Global tabs with counts (administrators also get Everyone's), then a search box.</li><li>Each row: time chip, name, a small Personal or Global label, edit and delete. Four bookmarks fit with no scrolling; only a long list scrolls.</li></ol></figcaption></figure>

 <div style="position:absolute;inset:0;background:rgba(0,0,0,.55)"></div><div class="cover" style="left:10%;top:16%;width:28%;aspect-ratio:1"></div>
 <div style="position:absolute;left:44%;top:18%;right:8%"><div style="font-size:46px;font-weight:700;line-height:1.05">Dune</div><div style="color:var(--t2);margin:8px 0 18px">Frank Herbert · Narrated by Scott Brick</div><div style="font-size:19px;font-weight:600;margin-bottom:6px">Chapter 4 of 21 · The Long Way Round</div><div style="color:var(--t2);max-width:520px">Set on the desert planet Arrakis, Dune is the story of the boy Paul Atreides, heir to a noble family tasked with ruling an inhospitable world.</div></div>
 <div class="m" style="left:calc(10% - 28px);top:16%">1</div><div class="m" style="left:calc(44% - 28px);top:18%">2</div></div>
<figcaption><b>Audiobook, paused (music is the same with song, artist and album).</b><ol><li>The cover stays visible, and the Now Playing page opens when you click it in the bottom player bar.</li><li>Left-aligned details with no lead-in line; no rating card for audio.</li></ol></figcaption></figure>
<figure><div class="screen"><div style="position:absolute;left:0;right:0;top:46%;text-align:center"><span style="background:rgba(0,0,0,.7);padding:4px 12px;font-size:26px;color:#fff">Will pitches a commercial to boost sales.</span></div>

 <div style="display:flex;justify-content:space-between;align-items:center;padding:4px"><span>Drop shadow</span><span style="width:40px;height:22px;border-radius:11px;background:#3a4560;position:relative"><i style="position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff"></i></span></div>
 <div style="text-align:center;margin-top:6px"><i style="display:inline-block;width:24px;height:24px;border-radius:50%;background:#fff;margin:0 5px;box-shadow:0 0 0 3px var(--panel),0 0 0 5px #fff"></i><i style="display:inline-block;width:24px;height:24px;border-radius:50%;background:#000;margin:0 5px;"></i><i style="display:inline-block;width:24px;height:24px;border-radius:50%;background:#3b5bd6;margin:0 5px;"></i><i style="display:inline-block;width:24px;height:24px;border-radius:50%;background:#40e0d0;margin:0 5px;"></i><i style="display:inline-block;width:24px;height:24px;border-radius:50%;background:#7ed321;margin:0 5px;"></i><i style="display:inline-block;width:24px;height:24px;border-radius:50%;background:#fcc419;margin:0 5px;"></i><i style="display:inline-block;width:24px;height:24px;border-radius:50%;background:#e03131;margin:0 5px;"></i><i style="display:inline-block;width:24px;height:24px;border-radius:50%;background:#b83ac4;margin:0 5px;"></i></div><div style="height:12px;border-radius:6px;background:linear-gradient(90deg,transparent,#fff);border:1px solid var(--t3);margin:12px 6px 4px;position:relative"><i style="position:absolute;right:-2px;top:-4px;width:18px;height:18px;border-radius:50%;background:#fff"></i></div>
 <div style="color:var(--t3);font-size:13px;margin:10px 4px 4px">Background</div>
 <div style="text-align:center"><i style="display:inline-block;width:24px;height:24px;border-radius:50%;background:#fff;margin:0 5px;box-shadow:0 0 0 3px var(--panel),0 0 0 5px #fff"></i><i style="display:inline-block;width:24px;height:24px;border-radius:50%;background:#000;margin:0 5px;"></i></div><div style="height:12px;border-radius:6px;background:linear-gradient(90deg,transparent,#fff);border:1px solid var(--t3);margin:12px 6px 4px;position:relative"><i style="position:absolute;right:-2px;top:-4px;width:18px;height:18px;border-radius:50%;background:#fff"></i></div>
 <div style="text-align:center;font-weight:600;padding-top:10px">Reset</div></div>
 <div class="m" style="left:44%;top:40%">1</div><div class="m" style="right:calc(3% + 388px);top:12%">2</div><div class="m" style="right:calc(3% + 388px);top:38%">3</div><div class="m" style="right:calc(3% + 388px);top:62%">4</div></div>
<figcaption><b>Subtitle style (its own menu).</b><ol><li>Changes show on the picture straight away.</li><li>A preview line, a three-way size selector, six font tiles and a drop shadow switch.</li><li>Text colour swatches with an opacity slider.</li><li>Background colour swatches with an opacity slider, and Reset. On a phone it is a bottom sheet with larger targets; on a TV it is a right-hand panel moved with the remote (up and down between rows, left and right across tiles, swatches and slider stops).</li></ol></figcaption></figure>
