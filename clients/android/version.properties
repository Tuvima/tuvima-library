# The one place the Android version is set (spec native-apps WP12). The phone app and the TV app share it.
#
# versionName is major.minor.patch, shown to people and used in the release tag: android-v<versionName>.
# versionBuild is 0 to 99. Raise it only to upload the same versionName again (Google Play refuses a
# versionCode it has seen before); then the tag is android-v<versionName>-build<versionBuild>.
# versionCode is worked out from these two, never typed:
#   major * 1000000 + minor * 10000 + patch * 100 + versionBuild
# so every higher version has a higher versionCode (0.1.0 build 0 is 10000, 0.1.1 is 10100, 1.0.0 is 1000000).
versionName=0.1.0
versionBuild=0
