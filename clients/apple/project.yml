name: TuvimaApple
options:
  bundleIdPrefix: com.tuvima.library
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  TuvimaCore:
    type: framework
    platform: iOS
    sources: [Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuvima.library.core
  Tuvima:
    type: application
    platform: iOS
    sources: [iOS]
    dependencies:
      - target: TuvimaCore
    entitlements:
      path: iOS/Tuvima.entitlements
      properties:
        com.apple.developer.carplay-audio: true
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Tuvima Library
        UILaunchScreen: {}
        UIBackgroundModes: [audio, fetch]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.tuvima.library.deep-link
            CFBundleURLSchemes: [tuvima]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: Tuvima.CarPlaySceneDelegate
schemes:
  Tuvima:
    build:
      targets:
        Tuvima: all
    test:
      targets: []
